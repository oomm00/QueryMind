services:
  # ── PostgreSQL Database ──────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: querymind_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-querymind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-querymind_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-querymind_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ChromaDB (Vector Store) ──────────────────────────────
  # Server tag mirrors the chromadb client pinned in backend/requirements.txt
  # (chromadb==0.5.0) so client and server stay protocol-compatible.
  chroma:
    image: chromadb/chroma:0.5.0
    container_name: querymind_chroma
    restart: unless-stopped
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      # v0.5.x exposes the heartbeat at /api/v1/heartbeat (server-native port 8000).
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── FastAPI Backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: querymind_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Inside the compose network Chroma listens on its container port 8000.
      # CHROMA_PORT in .env is the *host* port published below (default 8001);
      # without this override the backend would dial chroma:8001 and silently
      # fall back to a local persistent store. Pin the in-network port here.
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-querymind}:${POSTGRES_PASSWORD:-querymind_dev_password}@db:5432/${POSTGRES_DB:-querymind_db}
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
  chroma_data:
