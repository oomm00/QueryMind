services:
  # ── PostgreSQL Database ──────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: querymind_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-querymind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-querymind_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-querymind_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ChromaDB (Vector Store) ──────────────────────────────
  # Server tag mirrors the chromadb client pinned in backend/requirements.txt
  # (chromadb==0.5.0) so client and server stay protocol-compatible.
  chroma:
    image: chromadb/chroma:0.5.0
    container_name: querymind_chroma
    restart: unless-stopped
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      # v0.5.x exposes the heartbeat at /api/v1/heartbeat (server-native port 8000).
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── FastAPI Backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: querymind_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      # The repo-root .env supplies POSTGRES_*/GEMINI_API_KEY etc. to the
      # container. It is OPTIONAL: a fresh clone that only has backend/.env still
      # works, because the app loads backend/.env directly (see
      # app/core/config.py) and backend/ is bind-mounted to /app.
      - path: .env
        required: false
    environment:
      # Inside the compose network Chroma listens on its container port 8000.
      # CHROMA_PORT in .env is the *host* port published below (default 8001);
      # without this override the backend would dial chroma:8001 and silently
      # fall back to a local persistent store. Pin the in-network port here.
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      # Remote-first: no silent local Chroma. Set true only for a laptop demo
      # without the chroma service. Telemetry stays off in every mode.
      CHROMA_ALLOW_LOCAL_FALLBACK: ${CHROMA_ALLOW_LOCAL_FALLBACK:-false}
      CHROMA_CONNECT_TIMEOUT_SECONDS: ${CHROMA_CONNECT_TIMEOUT_SECONDS:-2}
      ANONYMIZED_TELEMETRY: "FALSE"
      DATABASE_URL: postgresql://${POSTGRES_USER:-querymind}:${POSTGRES_PASSWORD:-querymind_dev_password}@db:5432/${POSTGRES_DB:-querymind_db}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      DB_STATEMENT_TIMEOUT_SECONDS: ${DB_STATEMENT_TIMEOUT_SECONDS:-5}
      HEALTH_DB_TIMEOUT_SECONDS: ${HEALTH_DB_TIMEOUT_SECONDS:-5}
      SQL_ECHO: ${SQL_ECHO:-false}
      # The demo frontend may run on 5173 or 5174 when 5173 is occupied.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5174,http://127.0.0.1:5174,http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
      # Empty by default in the shell override disables the key for offline demos.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Demo-day switch: skip all LLM calls and use the deterministic evaluator.
      OFFLINE_DEMO_MODE: ${OFFLINE_DEMO_MODE:-false}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.1-flash-lite}
      LLM_EVAL_MODEL: ${LLM_EVAL_MODEL:-gemini-3.1-flash-lite}
      LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-gemini-flash-latest,gemini-3.5-flash-lite,gemini-3.1-flash-lite-preview}
      GENERATION_DEADLINE_SECONDS: ${GENERATION_DEADLINE_SECONDS:-60}
      GENERATION_CALL_TIMEOUT_SECONDS: ${GENERATION_CALL_TIMEOUT_SECONDS:-20}
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # Demo/production default: plain uvicorn, no file-watching reloader. For
    # local hot-reload, copy docker-compose.override.example.yml over
    # docker-compose.override.yml (compose auto-loads it; it is gitignored so
    # fresh clones stay demo-safe).
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"

volumes:
  postgres_data:
  chroma_data:
